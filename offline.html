<!doctype html>
<html lang="sq-AL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pa internet · Miku i Shëndetit</title>
<style>
  :root { color-scheme: light dark; --bg: #F6FAF9; --ink: #13201F; --muted: #536260; --brand: #0E7C74; }
  @media (prefers-color-scheme: dark) { :root { --bg: #071D1C; --ink: #EAF5F3; --muted: #A3C0BC; --brand: #8FD3C9; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, sans-serif; padding: 24px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 16px 0 8px; } p { color: var(--muted); margin: 0 0 24px; max-width: 28ch; }
  button, a { font: inherit; font-weight: 700; border: 0; border-radius: 999px; min-height: 48px; padding: 0 24px; background: #FF6B57; color: #13201F; cursor: pointer; text-decoration: none; display: inline-grid; place-items: center; }
  a { background: transparent; color: var(--brand); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/></svg>
  <h1>Nuk ka lidhje interneti</h1>
  <p>Kontrolloni Wi-Fi ose të dhënat celulare dhe provoni përsëri.</p>
  <button onclick="location.reload()">Provo përsëri</button><br>
  <a href="tel:127">Urgjencë? Telefononi 127</a>
</main>
</body>
</html>
